[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "signal-atlas"
version = "0.1.0"
description = "Local-first, source-linked security research infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<0.130",
  "uvicorn>=0.32,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
signal-atlas = "atlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
